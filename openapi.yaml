      tags: [Alliances]
      parameters:
        - name: invite_id
          in: path
          required: true
          schema: { type: string }

  /alliances/pending-invites/{invite_id}:
    delete:
      summary: Decline a pending alliance invite
      tags: [Alliances]
      parameters:
        - name: invite_id
          in: path
          required: true
