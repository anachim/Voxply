  /alliances/{alliance_id}:
    get:
      summary: Get alliance details and member hubs
      tags: [Alliances]
      parameters:
        - name: alliance_id
          in: path
          required: true
          schema: { type: string }

  /alliances/{alliance_id}/invite:
    post:
      summary: Create an invite token for another hub to join (manage_hub)
      tags: [Alliances]
      parameters:
        - name: alliance_id
          in: path
          required: true
          schema: { type: string }

  /alliances/{alliance_id}/leave:
    delete:
      summary: Leave an alliance (manage_hub)
      tags: [Alliances]
      parameters:
        - name: alliance_id
          in: path
          required: true
          schema: { type: string }

  /alliances/{alliance_id}/voice-grant:
    post:
      summary: Mint a voice grant for an allied hub's shared channel
      description: |
        Called by one of **this** hub's members, for a voice channel owned by
        another member of the alliance. Returns a short-lived (5 minute) grant to
        present at the owning hub's `POST /auth/verify`, plus where to present it.

        This hub gates on the only local permission that means anything about a
        remote channel — the caller is a member here, approved and not muted — and
        resolves the owning hub by asking each alliance member which shared
        channels it owns. Every channel fact is re-checked by the owning hub
        against its own shared set on redemption.
      tags: [Alliances]
      parameters:
        - name: alliance_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel_id]
              properties:
                channel_id: { type: string }
      responses:
        "200":
          description: Grant minted
          content:
            application/json:
              schema:
                type: object
                properties:
                  grant:
                    type: object
                    description: "Present verbatim as auth/verify's alliance_voice_grant"
                  owner_hub_url: { type: string }
                  owner_hub_pubkey: { type: string }
                  channel_name: { type: string }
        "400":
          description: not_a_voice_space — a category, banner or spawner has no room
        "403":
          description: not_a_member, not_in_good_standing, or muted
        "404":
          description: alliance_not_found, or no alliance member owns that channel
        "409":
          description: channel_is_local — this hub owns the channel; join voice normally

  /alliances/{alliance_id}/channels:
    get:
      summary: List channels shared into this alliance
      tags: [Alliances]
      parameters:
        - name: alliance_id
          in: path
          required: true
          schema: { type: string }
    post:
      summary: Share a channel into the alliance (manage_channels)
      description: >-
        Also the way the per-share policies are changed: re-sharing a channel
        with `forum_remote_write` or `voice_remote_join` set updates that
        policy. An omitted policy is left as it stands, so a re-share to flip
        `include_descendants` does not silently reset one. `include_descendants`
        is NOT omit-safe — it always takes the value sent.
      tags: [Alliances]
      parameters:
        - name: alliance_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel_id]
              properties:
                channel_id: { type: string }
                include_descendants:
                  type: boolean
                  default: false
                  description: >-
                    Share the whole subtree beneath this channel, resolved live
                    at read time rather than snapshotted.
                forum_remote_write:
                  type: string
                  enum: [none, replies_only, posts_and_replies]
                  description: "Federated forum writes into this channel (forum.md §9). Default replies_only."
                voice_remote_join:
                  type: string
                  enum: [allowed, none]
                  description: >-
                    Whether members of allied hubs may join voice here
                    (alliances.md). Default allowed; `none` refuses the grant
                    at redemption with `voice_remote_join_disabled`.
      responses:
        "200": { description: Shared }
        "400": { description: Unknown policy value }
        "403": { description: Caller lacks admin permission }
        "404": { description: Alliance or channel not found }

  /alliances/{alliance_id}/channels/{channel_id}:
    delete:
      summary: Unshare a channel from the alliance
      tags: [Alliances]
      parameters:
        - name: alliance_id
          in: path
          required: true
          schema: { type: string }
        - name: channel_id
          in: path
          required: true
          schema: { type: string }

  /alliances/{alliance_id}/channels/{channel_id}/messages:
    get:
      summary: Fetch federated channel messages
      tags: [Alliances]
      parameters:
        - name: alliance_id
          in: path
          required: true
          schema: { type: string }
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
    post:
      summary: Post to a federated alliance channel
      tags: [Alliances]
      parameters:
        - name: alliance_id
          in: path
          required: true
          schema: { type: string }
        - name: channel_id
          in: path
          required: true
          schema: { type: string }

  # Alliance-shared forum channels. Read-through proxies to the owning hub —
  # a locally-owned channel delegates to the local /channels/{id}/posts
  # handlers, a peer-owned one is resolved by walking alliance members and
  # proxied over federation. Same response shapes either way, so a client uses
  # one set of types. The owning hub stays authoritative; nothing replicates.
  # See forum.md §9.

  /alliances/{alliance_id}/channels/{channel_id}/posts:
    get:
      summary: List posts in an alliance-shared forum channel
      tags: [Alliances, Forum]
      parameters:
        - name: alliance_id
          in: path
          required: true
          schema: { type: string }
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 100 }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items: { $ref: '#/components/schemas/PostSummary' }
                  cursor: { type: string, description: "Omitted on the last page" }
        "403": { description: Channel is not shared with the caller, or remote writes are off }
        "409": { description: Channel is not a forum }
    post:
      summary: Create a post in an alliance-shared forum channel
      description: >-
        Subject to the owning channel's `forum_remote_write` policy —
        `none`, `replies_only` (rejects this) or `posts_and_replies`.
      tags: [Alliances, Forum]
      parameters:
        - name: alliance_id
          in: path
          required: true
          schema: { type: string }
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [title, body]
              properties:
                title: { type: string }
                body: { type: string }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostDetail' }
        "403": { description: forum_remote_write_disabled / forum_remote_write_posts_disabled }

  /alliances/{alliance_id}/channels/{channel_id}/posts/{post_id}:
    get:
      summary: One post with its replies, from an alliance-shared forum channel
      tags: [Alliances, Forum]
      parameters:
        - name: alliance_id
          in: path
          required: true
          schema: { type: string }
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
        - name: post_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostDetail' }
    delete:
      summary: Retract a post the caller's hub authored
      description: >-
        The owning hub honours this only when the post's `author_hub` is the
        calling hub **and** its author matches — a hub can retract its own
        users' content, never anyone else's.
      tags: [Alliances, Forum]
      parameters:
        - name: alliance_id
          in: path
          required: true
          schema: { type: string }
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
        - name: post_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Retracted }
        "403": { description: The post belongs to another hub or another author }

  /alliances/{alliance_id}/channels/{channel_id}/posts/{post_id}/replies:
    post:
      summary: Reply to a post in an alliance-shared forum channel
      tags: [Alliances, Forum]
      parameters:
        - name: alliance_id
          in: path
          required: true
          schema: { type: string }
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
        - name: post_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
                reply_to_id: { type: string, description: For threaded replies }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReplyView' }
        "403": { description: Remote writes disabled on the owning channel }

  /alliances/{alliance_id}/channels/{channel_id}/posts/{post_id}/replies/{reply_id}:
    delete:
      summary: Retract a reply the caller's hub authored
      tags: [Alliances, Forum]
      parameters:
        - name: alliance_id
          in: path
          required: true
          schema: { type: string }
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
        - name: post_id
          in: path
          required: true
          schema: { type: string }
        - name: reply_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Retracted }
        "403": { description: The reply belongs to another hub or another author }

  /alliances/{alliance_id}/channels/{channel_id}/posts/{post_id}/reactions:
    post:
      summary: React to a post in an alliance-shared forum channel
      tags: [Alliances, Forum]
      parameters:
        - name: alliance_id
          in: path
          required: true
          schema: { type: string }
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
        - name: post_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [emoji]
              properties:
                emoji: { type: string }
      responses:
        "204": { description: Reaction applied }

  # ── Lobby ─────────────────────────────────────────────────────────────────

  /lobby/status:
    get:
      summary: Get lobby status for the current user
      description: Available when session scope is "lobby". Returns PoW progress.
      tags: [Lobby]
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LobbyStatus' }

  /lobby/submit-pow:
    post:
      summary: Submit a PoW nonce to increase security level
      description: |
        Compute `SHA256(utf8(public_key_hex) || little_endian_u64(nonce))` and
        find a nonce whose hash has ≥ N leading zero bits, then submit here.
        On promotion, the session scope changes to "member".
      tags: [Lobby]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [nonce, claimed_level]
              properties:
                nonce: { type: integer, format: int64 }
                claimed_level: { type: integer }

  /lobby/welcome:
    get:
      summary: Get the hub's welcome message (Markdown)
      tags: [Lobby]

  # ── Bot Challenge ─────────────────────────────────────────────────────────

  /challenge/new:
    get:
      summary: Fetch a bot-challenge prompt
      description: |
        Returns a challenge the user must solve before auth. Mode is set by the hub admin.
        - `click`: no SVG, user just confirms they are human.
        - `puzzle`: SVG math puzzle, user types the answer.
        - `both`: SVG puzzle shown, click confirmation also required.
      security: []
      tags: [Challenge]
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChallengePrompt' }

  /challenge/verify:
    post:
      summary: Submit challenge answer and receive a one-time token
      description: |
        On success returns a `challenge_token` to include in `POST /auth/verify`.
      security: []
      tags: [Challenge]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [challenge_id]
              properties:
                challenge_id: { type: string }
                answer: { type: string, description: "Numeric answer for puzzle mode; omit for click-only" }

  # ── Survey ────────────────────────────────────────────────────────────────

  /survey/current:
    get:
      summary: Get the active onboarding survey
      tags: [Survey]

  /survey/submit:
    post:
      summary: Submit survey answers
      description: |
        Choice answers auto-apply configured roles. Free-text answers route the
        user to pending approval. Returns the resulting approval state.
      tags: [Survey]

  /admin/survey:
    get:
      summary: Get full survey config including role mappings (manage_hub)
      tags: [Survey]
    put:
      summary: Create or replace the survey (manage_hub)
      tags: [Survey]

  /admin/survey/responses:
    get:
      summary: List all survey responses (manage_hub)
      tags: [Survey]

  /admin/survey/responses/{pubkey}:
    get:
      summary: Get a specific user's survey response (manage_hub)
      tags: [Survey]
      parameters:
        - name: pubkey
          in: path
          required: true
          schema: { type: string }

  # ── Bots (admin) ──────────────────────────────────────────────────────────

  /admin/bots/external:
    get:
      summary: List every external bot row (admin view)
      description: >-
        Unlike `GET /bots` — the member-facing directory of accepted,
        non-removed bots — this includes pending invites, removed bots, and the
        admin-only local note. See bots.md §4.
      tags: [Bots]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    public_key: { type: string }
                    display_name: { type: string, nullable: true }
                    local_note: { type: string, nullable: true }
                    approval_status: { type: string }
                    last_seen_at: { type: integer, nullable: true }

  /admin/bots/{pubkey}/capabilities:
    get:
      summary: A bot's requested, granted and effective capabilities
      description: >-
        The three sets side by side. `requested` is the bot's own declaration,
        `granted` is what an admin allowed, and `effective` is their
        intersection — the only set any runtime gate trusts. Not derivable from
        the PUT response, which echoes `granted` only.
        See bot-capability-layer.md §1.
      tags: [Bots]
      parameters:
        - name: pubkey
          in: path
          required: true
          schema: { type: string }
          description: >-
            An external bot or a self-service bot — grants are keyed on the bare
            pubkey and do not care which.
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  requested:
                    type: array
                    items: { type: string }
                    description: Self-declared. Always empty for a self-service bot.
                  granted: { type: array, items: { type: string } }
                  effective: { type: array, items: { type: string } }
    put:
      summary: Replace a bot's granted capabilities
      description: >-
        Writes the granted side only. Granting a capability the bot never
        requested is inert until the bot also declares it.
      tags: [Bots]
      parameters:
        - name: pubkey
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [capabilities]
              properties:
                capabilities: { type: array, items: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  bot_pubkey: { type: string }
                  capabilities: { type: array, items: { type: string } }

  /admin/bots/{pubkey}/channels:
    get:
      summary: A bot's channel scope
      description: An empty list means hub-wide access. See bots.md §14.
      tags: [Bots]
      parameters:
        - name: pubkey
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BotChannelScope' }
    put:
      summary: Replace a bot's channel scope (atomic)
      description: An empty or omitted `channel_ids` resets to hub-wide access.
      tags: [Bots]
      parameters:
        - name: pubkey
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                channel_ids: { type: array, items: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BotChannelScope' }

  # ── Bots (bot API) ────────────────────────────────────────────────────────

  /bot/send:
    post:
      summary: Send a message as this bot
      description: Authenticated with bot token.
      tags: [Bots]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [channel_id, content]
              properties:
                channel_id: { type: string }
                content: { type: string }

  /bot/poll:
    get:
      summary: Poll for undelivered events (slash command invocations)
      description: Authenticated with bot token.
      tags: [Bots]
      parameters:
        - name: since
          in: query
          schema: { type: integer }
          description: Unix timestamp — return events created after this time

  /bot/events:
    delete:
      summary: Acknowledge delivered events
      description: Authenticated with bot token.
      tags: [Bots]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, items: { type: string } }

  # ── Identity / Multi-device ───────────────────────────────────────────────

  /identity/{master}/designation:
    get:
      summary: Get the canonical display-name designation for a master key
      tags: [Identity]
      parameters:
        - name: master
          in: path
          required: true
          schema: { type: string }
    post:
      summary: Set designation
      tags: [Identity]
      parameters:
        - name: master
          in: path
          required: true
          schema: { type: string }

  /identity/{master}/devices:
    get:
      summary: List devices linked to a master key
      tags: [Identity]
      parameters:
        - name: master
          in: path
          required: true
          schema: { type: string }
    post:
      summary: Register a new device subkey
      tags: [Identity]
      parameters:
        - name: master
          in: path
          required: true
          schema: { type: string }

  /identity/{master}/revocations:
    get:
      summary: List revoked device keys
      tags: [Identity]
      parameters:
        - name: master
          in: path
          required: true
          schema: { type: string }
    post:
      summary: Revoke a device key
      tags: [Identity]
      parameters:
        - name: master
          in: path
          required: true
          schema: { type: string }

  /identity/{master}/prefs:
    get:
      summary: Get cross-device preferences blob
      tags: [Identity]
      parameters:
        - name: master
          in: path
          required: true
          schema: { type: string }
    put:
      summary: Store cross-device preferences blob
      tags: [Identity]
      parameters:
        - name: master
          in: path
          required: true
          schema: { type: string }

  /identity/{pubkey}/dh-key:
    get:
      summary: Get DH public key for E2E encryption key exchange
      tags: [Identity]
      parameters:
        - name: pubkey
          in: path
          required: true
          schema: { type: string }
    put:
      summary: Publish own DH public key
      tags: [Identity]
      parameters:
        - name: pubkey
          in: path
          required: true
          schema: { type: string }

  /identity/pairing/offer:
    post:
      summary: Create a device-pairing offer
      tags: [Identity]

  /identity/pairing/claim:
    post:
      summary: Claim a pairing offer from a new device
      tags: [Identity]

  /identity/pairing/complete:
    post:
      summary: Complete the pairing handshake
      tags: [Identity]

  /identity/pairing/status/{token}:
    get:
      summary: Poll pairing status
      tags: [Identity]
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }

  # ── Profile ───────────────────────────────────────────────────────────────

  /profile/{pubkey}:
    get:
      summary: Get public hub-list profile for a user
      security: []
      tags: [Profile]
      parameters:
        - name: pubkey
          in: path
          required: true
          schema: { type: string }
    put:
      summary: Publish own public hub-list profile
      tags: [Profile]
      parameters:
        - name: pubkey
          in: path
          required: true
          schema: { type: string }

  # ── Federation ────────────────────────────────────────────────────────────

  /federation/peers:
    get:
      summary: List federated peer hubs
      tags: [Federation]
    post:
      summary: Add a federation peer
      tags: [Federation]

  /federation/peers/{peer_key}/channels:
    get:
      summary: List channels shared by a peer hub
      tags: [Federation]
      parameters:
        - name: peer_key
          in: path
          required: true
          schema: { type: string }

  /federation/channels:
    get:
      summary: List all federated channels across all peers
      tags: [Federation]

  /federation/channels/{fed_channel_id}/messages:
    get:
      summary: Fetch messages from a federated channel
      tags: [Federation]
      parameters:
        - name: fed_channel_id
          in: path
          required: true
          schema: { type: string }
    post:
      summary: Post a message to a federated channel
      tags: [Federation]
      parameters:
        - name: fed_channel_id
          in: path
          required: true
          schema: { type: string }

  /federation/dm:
    post:
      summary: Receive a federated DM from a peer hub
      description: Called hub-to-hub, authenticated with the sending hub's Ed25519 key.
      tags: [Federation]

  /federation/alliance-invite:
    post:
      summary: Receive an alliance invite push from a peer hub
      tags: [Federation]

  /admin/directory-sign:
    post:
      summary: Sign a directory entry for the hub discovery service
      tags: [Federation]

  /preview:
    get:
      summary: Fetch a link preview (title/description/image) for a URL
      description: >-
        Server-side fetch with SSRF protection (private/loopback/link-local
        targets rejected, DNS result pinned for the fetch). Responses are
        cached per URL. Rate-limited to 10 requests per 60 seconds per user;
        excess returns 429.
      tags: [Messages]
      parameters:
        - name: url
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  title: { type: string, nullable: true }
                  description: { type: string, nullable: true }
                  image_url: { type: string, nullable: true }
        "429":
          description: Per-user rate limit exceeded

  /admin/search/reindex:
    post:
      summary: Rebuild the full-text search index from the messages table (admin)
      description: >-
        Starts an asynchronous reindex and returns immediately. A second call
        while a reindex is running returns `{"status":"already_running"}`
        instead of starting a duplicate job.
      tags: [Moderation]
      responses:
        "202":
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [started, already_running] }
        "401": { description: Missing/invalid token }
        "403": { description: Caller lacks admin permission }

  # Hub-to-hub forum write-through (forum.md §9 phases 2–3). Called by a peer
  # hub on behalf of one of its users, not by a client — authentication is the
  # peer-hub signature, not a member bearer token, and `author_pubkey` is the
  # remote user the calling hub asserts. Every route is gated by the owning
  # channel's `forum_remote_write` policy: `none`, `replies_only`, or
  # `posts_and_replies`.

  /federation/forum/channels/{channel_id}/posts:
    post:
      summary: A peer hub creates a post in a shared forum channel
      description: Requires `forum_remote_write = posts_and_replies`.
      security: []
      tags: [Federation, Forum]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [author_pubkey, title, body]
              properties:
                author_pubkey: { type: string, description: The remote user the calling hub asserts }
                title: { type: string }
                body: { type: string }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostDetail' }
        "400": { description: author_pubkey_required / title_required / body_required }
        "403": { description: channel_not_shared_with_caller / forum_remote_write_disabled / forum_remote_write_posts_disabled }
        "409": { description: Channel is not a forum }
        "429": { description: Per-peer federated forum rate limit }

  /federation/forum/channels/{channel_id}/posts/{post_id}:
    delete:
      summary: A peer hub retracts one of its own users' posts
      description: >-
        Honoured only when the post's `author_hub` matches the calling peer
        **and** its `author_pubkey` matches the assertion — a hub can retract
        its own users' content, never anyone else's.
      security: []
      tags: [Federation, Forum]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
        - name: post_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [author_pubkey]
              properties:
                author_pubkey: { type: string }
      responses:
        "204": { description: Retracted }
        "403": { description: The post belongs to another hub or another author }

  /federation/forum/channels/{channel_id}/posts/{post_id}/replies:
    post:
      summary: A peer hub replies to a post in a shared forum channel
      description: Allowed under `replies_only` as well as `posts_and_replies`.
      security: []
      tags: [Federation, Forum]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
        - name: post_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [author_pubkey, body]
              properties:
                author_pubkey: { type: string }
                body: { type: string }
                reply_to_id: { type: string, description: For threaded replies }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReplyView' }
        "403": { description: forum_remote_write_disabled }
        "429": { description: Per-peer federated forum rate limit }

  /federation/forum/channels/{channel_id}/posts/{post_id}/replies/{reply_id}:
    delete:
      summary: A peer hub retracts one of its own users' replies
      security: []
      tags: [Federation, Forum]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
        - name: post_id
          in: path
          required: true
          schema: { type: string }
        - name: reply_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [author_pubkey]
              properties:
                author_pubkey: { type: string }
      responses:
        "204": { description: Retracted }
        "403": { description: The reply belongs to another hub or another author }

  /federation/forum/channels/{channel_id}/posts/{post_id}/reactions:
    post:
      summary: A peer hub adds one of its users' reactions to a post
      security: []
      tags: [Federation, Forum]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
        - name: post_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [author_pubkey, emoji]
              properties:
                author_pubkey: { type: string }
                emoji: { type: string }
      responses:
        "204": { description: Reaction applied }
        "403": { description: forum_remote_write_disabled }

  # ── Auth (session renewal) ────────────────────────────────────────────────

  /auth/renew:
    post:
      summary: Renew the current session token
      description: |
        Issues a fresh 30-day token while the current one is still live
        (intended for bots renewing long-lived tokens proactively). Requires
        both a valid Bearer token and a fresh challenge-response — same body
        as `POST /auth/verify`; the pubkey must match the authenticated
        identity. The old token is NOT invalidated.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public_key, challenge, signature]
              properties:
                public_key: { type: string }
                challenge: { type: string }
                signature: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  expires_at: { type: integer, description: "Unix timestamp" }

  # ── WebAuthn / passkeys (see webauthn-auth.md) ────────────────────────────

  /auth/webauthn/begin:
    post:
      summary: Start WebAuthn passkey registration
      description: Excludes credentials the user already has so re-registering the same authenticator is blocked.
      security: []
      tags: [Auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [user_pubkey]
              properties:
                user_pubkey: { type: string, description: "Hex-encoded Ed25519 public key" }
                display_name: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id: { type: string }
                  options: { type: object, description: "PublicKeyCredentialCreationOptions" }

  /auth/webauthn/finish:
    post:
      summary: Complete WebAuthn passkey registration and issue a session token
      security: []
      tags: [Auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [session_id, credential]
              properties:
                session_id: { type: string }
                credential: { type: object, description: "RegisterPublicKeyCredential from navigator.credentials.create()" }
                friendly_name: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_token: { type: string }
        "400":
          description: Unknown/expired session, or registration verification failed

  /auth/webauthn/assert/begin:
    post:
      summary: Start WebAuthn passkey authentication (login)
      security: []
      tags: [Auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [user_pubkey]
              properties:
                user_pubkey: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_id: { type: string }
                  options: { type: object, description: "PublicKeyCredentialRequestOptions" }
        "404":
          description: No passkeys registered for this user

  /auth/webauthn/assert/finish:
    post:
      summary: Complete WebAuthn assertion and issue a session token
      security: []
      tags: [Auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [session_id, credential]
              properties:
                session_id: { type: string }
                credential: { type: object, description: "PublicKeyCredential assertion from navigator.credentials.get()" }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_token: { type: string }
        "401":
          description: Assertion verification failed

  /auth/device-token/create:
    post:
      summary: Mint a long-lived "trust this device" token
      description: Requires an existing session (e.g. right after a WebAuthn assertion).
      tags: [Auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                device_name: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  token: { type: string, description: "Shown once — store hashed on the client" }
                  expires_at: { type: integer }

  /auth/device-token/redeem:
    post:
      summary: Exchange a device token for a fresh session token
      description: Rotates the device token on each use (issues a new one, invalidates the old).
      security: []
      tags: [Auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  session_token: { type: string }
        "401":
          description: Device token expired, revoked, or invalid

  # ── Operational ───────────────────────────────────────────────────────────

  /metrics:
    get:
      summary: Prometheus metrics (text exposition format)
      security: []
      tags: [Health]
      responses:
        "200":
          description: "`text/plain` gauges/counters: online users, voice participants, game sessions, video channels, messages total, uptime, DB size."

  /key-rotation:
    get:
      summary: Get the signed hub key-rotation payload
      description: Serves `hub_rotation.json` if the hub has rotated its keypair, so federation peers can follow the rotation. 204 when no rotation exists.
      security: []
      tags: [Federation]
      responses:
        "200":
          description: Signed rotation payload (JSON)
        "204":
          description: No rotation on record

  # ── Admin settings ────────────────────────────────────────────────────────

  /admin/settings/pow:
    get:
      summary: Get the minimum PoW level setting (admin)
      tags: [Hub]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  min_pow_level: { type: integer }
    patch:
      summary: Update the minimum PoW level (admin)
      tags: [Hub]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [min_pow_level]
              properties:
                min_pow_level: { type: integer }

  /admin/settings/channel-depth:
    get:
      summary: Get the maximum channel nesting depth (admin)
      tags: [Hub]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  max_channel_depth: { type: integer }
    patch:
      summary: Update the maximum channel nesting depth (admin)
      tags: [Hub]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [max_channel_depth]
              properties:
                max_channel_depth: { type: integer }

  /admin/settings/moderation:
    patch:
      summary: Set the auto-moderation webhook URL and HMAC secret (admin)
      tags: [Hub]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                webhook_url: { type: string }
                webhook_secret: { type: string }

  /admin/settings/listing:
    patch:
      summary: Toggle whether the hub is listed for discovery (admin)
      tags: [Hub]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [listed]
              properties:
                listed: { type: boolean }

  /admin/settings/tags:
    get:
      summary: Get hub self-tags and NSFW flag (admin)
      tags: [Hub]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  tags: { type: array, items: { type: string } }
                  nsfw: { type: boolean }
    patch:
      summary: Replace hub self-tags (admin)
      description: >-
        Max 12 tags, each 1–32 chars of `a-z0-9-` after normalisation.
        Reserved words (verified, certified, official, partner, admin) are
        rejected. Returns the normalised tag list.
      tags: [Hub]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [tags]
              properties:
                tags: { type: array, items: { type: string } }
                nsfw: { type: boolean }

  # ── Federated ban list (admin) ─────────────────────────────────────────────

  /admin/banlist/sources:
    get:
      summary: List federated ban list sources (admin)
      tags: [Federation]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    url: { type: string }
                    policy: { type: string, enum: [hard-reject, soft-flag] }
                    added_at: { type: integer }
                    issuer_pubkey: { type: string, nullable: true }
    post:
      summary: Add a ban list source and trigger an immediate sync (admin)
      tags: [Federation]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string }
                policy: { type: string, enum: [hard-reject, soft-flag], default: hard-reject }
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  policy: { type: string }
                  added_at: { type: integer }
                  issuer_pubkey: { type: string, nullable: true }
    patch:
      summary: Update the policy on an existing ban list source (admin)
      tags: [Federation]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [url, policy]
              properties:
                url: { type: string }
                policy: { type: string, enum: [hard-reject, soft-flag] }
      responses:
        "404":
          description: Source not found
    delete:
      summary: Remove a ban list source and its synced entries (admin)
      tags: [Federation]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string }

  /admin/banlist/entries:
    get:
      summary: List synced federated ban entries (admin)
      tags: [Federation]
      parameters:
        - name: source
          in: query
          schema: { type: string }
          description: Filter by source hub pubkey
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    source_hub_pubkey: { type: string }
                    target_master_pubkey: { type: string }
                    reason: { type: string, nullable: true }
                    added_at: { type: integer }
                    synced_at: { type: integer }

  /moderation/history/{pubkey}:
    get:
      summary: What other hubs have said about this member
      description: >-
        Entries from subscribed federated ban lists that name this member,
        soft-flag ones included — those do not block admission and exist to be
        read. Resolved against the member master pubkey where they have one,
        matching admission, so a paired device does not show a clean record.
        Requires ban_members.
      tags: [Federation]
      parameters:
        - name: pubkey
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        source_hub_pubkey: { type: string }
                        policy: { type: string, enum: [hard-reject, soft-flag] }
                        reason: { type: string, nullable: true }
                        added_at: { type: integer }

  /admin/banlist/overrides:
    get:
      summary: List local ban list overrides (admin)
      tags: [Federation]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    target_pubkey: { type: string }
                    override_type: { type: string, enum: [whitelist, blacklist] }
                    reason: { type: string, nullable: true }
                    created_at: { type: integer }
    post:
      summary: Add a local whitelist/blacklist override (admin)
      tags: [Federation]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [target_pubkey, override_type]
              properties:
                target_pubkey: { type: string }
                override_type: { type: string, enum: [whitelist, blacklist] }
                reason: { type: string }
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                properties:
                  target_pubkey: { type: string }
                  override_type: { type: string }
                  reason: { type: string, nullable: true }
                  created_at: { type: integer }

  /admin/banlist/overrides/{pubkey}:
    delete:
      summary: Remove a ban list override (admin)
      tags: [Federation]
      parameters:
        - name: pubkey
          in: path
          required: true
          schema: { type: string }

  /admin/settings/banlist:
    get:
      summary: Get ban list publishing settings and configured sources (admin)
      tags: [Federation]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  publish_banlist: { type: boolean }
                  sources:
                    type: array
                    items:
                      type: object
                      properties:
                        url: { type: string }
                        policy: { type: string }
                        added_at: { type: integer }
                        issuer_pubkey: { type: string, nullable: true }
    patch:
      summary: Toggle whether this hub publishes its ban list (admin)
      tags: [Federation]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [publish_banlist]
              properties:
                publish_banlist: { type: boolean }

  /admin/audit-log:
    get:
      summary: Cursor-paginated hub audit log (admin)
      tags: [Moderation]
      parameters:
        - name: event_type
          in: query
          schema: { type: string }
        - name: since
          in: query
          schema: { type: integer }
          description: Unix timestamp lower bound
        - name: until
          in: query
          schema: { type: integer }
          description: Unix timestamp upper bound
        - name: cursor
          in: query
          schema: { type: integer }
          description: "`next_cursor` from the previous page"
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        seq: { type: integer }
                        event_type: { type: string }
                        at: { type: integer }
                        actor_pubkey: { type: string, nullable: true }
                        target_pubkey: { type: string, nullable: true }
                        channel_id: { type: string, nullable: true }
                        payload: { type: object }
                  next_cursor: { type: integer, nullable: true }

  # ── Unread counts ─────────────────────────────────────────────────────────

  /channels/unread:
    get:
      summary: Unread message counts for every visible channel
      tags: [Channels]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    channel_id: { type: string }
                    unread_count: { type: integer }

  /channels/{channel_id}/read:
    post:
      summary: Mark a channel as read up to now
      tags: [Channels]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }

  # ── Message pins ──────────────────────────────────────────────────────────

  /channels/{channel_id}/pins:
    get:
      summary: List pinned messages in a channel
      description: Newest pin first. Paged only on hubs advertising `list.cursor.lists`.
      tags: [Messages]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          description: Page size, clamped to 1..500.
          schema: { type: integer, default: 100, minimum: 1, maximum: 500 }
        - name: cursor
          in: query
          description: Keyset cursor — the `message_id` of the previous page's last row.
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    message_id: { type: string }
                    pinned_by: { type: string }
                    pinned_at: { type: integer }
                    message:
                      type: object
                      properties:
                        id: { type: string }
                        content: { type: string }
                        sender: { type: string }
                        sender_name: { type: string, nullable: true }
                        created_at: { type: integer }

  /channels/{channel_id}/pins/{message_id}:
    post:
      summary: Pin a message (manage_messages)
      tags: [Messages]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
        - name: message_id
          in: path
          required: true
          schema: { type: string }
    delete:
      summary: Unpin a message (manage_messages)
      tags: [Messages]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
        - name: message_id
          in: path
          required: true
          schema: { type: string }

  # ── File uploads ──────────────────────────────────────────────────────────

  /channels/{channel_id}/upload:
    post:
      summary: Upload a file to a channel
      description: >-
        Multipart upload with the file in a `file` field. Max 25 MB
        (512 KB for banner channels, which also only accept PNG/JPEG/GIF/WebP).
        SVG is rejected. Allowed types otherwise: image/*, video/mp4,
        application/pdf, text/plain.
      tags: [Uploads]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  url: { type: string, description: "Path under /uploads/" }
                  filename: { type: string }
                  size_bytes: { type: integer }
                  mime_type: { type: string }
        "413":
          description: File exceeds the size limit
        "415":
          description: Mime type not allowed

  /uploads/{filename}:
    get:
      summary: Download an uploaded file
      description: >-
        Public — filenames are unguessable UUIDs. Always served with
        `Content-Disposition: attachment`.
      security: []
      tags: [Uploads]
      parameters:
        - name: filename
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: File bytes
        "404":
          description: File not found

  # ── Soundboard ────────────────────────────────────────────────────────────

  /soundboard:
    get:
      summary: List every clip in the hub's soundboard library
      description: Any authenticated member may list; playing one is gated separately by use_soundboard.
      tags: [Soundboard]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
                    emoji: { type: string, nullable: true }
                    uploader: { type: string }
                    size_bytes: { type: integer }
                    duration_ms: { type: integer }
                    created_at: { type: integer }
    post:
      summary: Upload a soundboard clip (manage_soundboard)
      description: >-
        Multipart upload: `name` (text), optional `emoji` (text), `audio`
        (Opus-in-Ogg file, ≤512 KB, ≤10s). Hubs cap at 50 clips.
      tags: [Soundboard]
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, audio]
              properties:
                name: { type: string }
                emoji: { type: string }
                audio: { type: string, format: binary }
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
                  emoji: { type: string, nullable: true }
                  uploader: { type: string }
                  size_bytes: { type: integer }
                  duration_ms: { type: integer }
                  created_at: { type: integer }
        "400":
          description: Missing fields, clip too large/long, invalid Opus/Ogg container, or hub clip limit reached

  /soundboard/{id}:
    delete:
      summary: Delete a soundboard clip (manage_soundboard)
      tags: [Soundboard]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }

  /soundboard/{id}/audio:
    get:
      summary: Fetch a clip's raw Opus-in-Ogg audio bytes
      description: Clips are immutable once uploaded, so responses are cacheable indefinitely.
      tags: [Soundboard]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "`audio/ogg` bytes"

  /soundboard/{id}/played:
    post:
      summary: Broadcast a "clip played" attribution event (use_soundboard)
      description: >-
        Attribution UX only — the hub does not verify the clip was actually
        mixed into the caller's outgoing audio; the channel-scoped
        use_soundboard permission check is the real enforcement.
      tags: [Soundboard]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [channel_id]
              properties:
                channel_id: { type: string }

  # ── Content reporting ─────────────────────────────────────────────────────

  /messages/{id}/report:
    post:
      summary: Report a message for moderator review
      tags: [Moderation]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        "200":
          description: Report recorded
        "429":
          description: Caller already reported this message

  /admin/reports:
    get:
      summary: List message reports (admin)
      tags: [Moderation]
      parameters:
        - name: status
          in: query
          schema: { type: string, default: pending, enum: [pending, reviewed] }
        - name: limit
          in: query
          description: Page size, clamped to 1..200.
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
        - name: cursor
          in: query
          description: Keyset cursor — the `id` of the previous page's last row.
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    message_id: { type: string }
                    message_content: { type: string, nullable: true }
                    channel_id: { type: string }
                    reporter_pubkey: { type: string }
                    reason: { type: string }
                    reported_at: { type: integer }
                    status: { type: string }

  /admin/reports/{id}/review:
    post:
      summary: Review a report — dismiss, delete the message, or ban the sender (admin)
      tags: [Moderation]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [dismiss, delete_message, ban_user] }
                note: { type: string }

  # ── Search ────────────────────────────────────────────────────────────────

  /search:
    get:
      summary: Full-text search across messages
      description: >-
        Searches the hub message index across all text channels the caller is
        not banned from. Queries shorter than 2 characters return an empty
        array.
      tags: [Search]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    message_id: { type: string }
                    channel_id: { type: string }
                    channel_name: { type: string }
                    sender: { type: string }
                    sender_name: { type: string, nullable: true }
                    content_preview: { type: string }
                    created_at: { type: integer }

  # ── Custom emojis ─────────────────────────────────────────────────────────

  /emojis:
    get:
      summary: List custom emojis
      security: []
      tags: [Emojis]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
                    url: { type: string, description: "Path to /emojis/{id}/image" }

  /emojis/{id}/image:
    get:
      summary: Get the emoji image bytes
      security: []
      tags: [Emojis]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Image bytes with the stored mime type, cacheable for 24h

  /admin/emojis:
    post:
      summary: Upload a custom emoji (admin)
      tags: [Emojis]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, mime, data_b64]
              properties:
                name: { type: string }
                mime: { type: string }
                data_b64: { type: string, description: "Base64 image data, max ~90KB encoded" }
      responses:
        "201":
          description: Emoji created

  /admin/emojis/{id}:
    delete:
      summary: Delete a custom emoji (admin)
      tags: [Emojis]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }

  # ── Events / calendar ─────────────────────────────────────────────────────

  /events:
    get:
      summary: List hub events with RSVP counts
      tags: [Events]
      parameters:
        - name: upcoming
          in: query
          schema: { type: boolean, default: false }
          description: Only events starting now or later
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    channel_id: { type: string }
                    creator_pubkey: { type: string }
                    title: { type: string }
                    description: { type: string }
                    starts_at: { type: integer }
                    ends_at: { type: integer, nullable: true }
                    location: { type: string, nullable: true }
                    created_at: { type: integer }
                    rsvp_counts:
                      type: object
                      properties:
                        going: { type: integer }
                        maybe: { type: integer }
                        not_going: { type: integer }
    post:
      summary: Create an event (create_events)
      description: Also posts a system card message into the target channel.
      tags: [Events]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [channel_id, title, starts_at]
              properties:
                channel_id: { type: string }
                title: { type: string }
                description: { type: string }
                starts_at: { type: integer, description: "Unix timestamp" }
                ends_at: { type: integer }
                location: { type: string }

  /events/{event_id}:
    get:
      summary: Get an event with RSVP counts
      tags: [Events]
      parameters:
        - name: event_id
          in: path
          required: true
          schema: { type: string }
    put:
      summary: Update an event (creator or admin)
      tags: [Events]
      parameters:
        - name: event_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                description: { type: string }
                starts_at: { type: integer }
                ends_at: { type: integer }
                location: { type: string }
    delete:
      summary: Delete an event (creator or admin)
      tags: [Events]
      parameters:
        - name: event_id
          in: path
          required: true
          schema: { type: string }

  /events/{event_id}/rsvp:
    post:
      summary: RSVP to an event (upserts the caller's status)
      tags: [Events]
      parameters:
        - name: event_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [going, maybe, not_going] }

  /events/{event_id}/rsvps:
    get:
      summary: List individual RSVPs for an event
      tags: [Events]
      parameters:
        - name: event_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    user_pubkey: { type: string }
                    status: { type: string }

  /events/{event_id}/slots:
    post:
      summary: Create a sign-up slot for an event (creator or admin)
      tags: [Events]
      parameters:
        - name: event_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                capacity: { type: integer, nullable: true, description: "Omit or null = unlimited" }
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
                  capacity: { type: integer, nullable: true }
                  position: { type: integer }
                  claimed: { type: integer }
                  claimants: { type: array, items: { type: string } }

  /events/{event_id}/slots/{slot_id}:
    patch:
      summary: Rename or resize a slot (creator or admin)
      description: Rejects shrinking capacity below the current claim count; demote claimants off the slot first.
      tags: [Events]
      parameters:
        - name: event_id
          in: path
          required: true
          schema: { type: string }
        - name: slot_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                capacity: { type: integer, nullable: true }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  name: { type: string }
                  capacity: { type: integer, nullable: true }
                  position: { type: integer }
                  claimed: { type: integer }
                  claimants: { type: array, items: { type: string } }
        "400":
          description: New capacity is below the current claim count
    delete:
      summary: Delete a slot (creator or admin)
      description: Rejects deletion while the slot still has claimants — move them off the slot first.
      tags: [Events]
      parameters:
        - name: event_id
          in: path
          required: true
          schema: { type: string }
        - name: slot_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "409":
          description: Slot has claimants

  /events/{event_id}/assignments:
    get:
      summary: Every move assignment for an event
      description: >-
        Requires `read_messages` on the event's anchor channel plus organizer
        or `move_members`. 404 (not 403) when the event does not exist or the
        caller cannot read its anchor — an id alone must not confirm a hidden
        channel exists. See events.md §7.4.
      tags: [Events]
      parameters:
        - name: event_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    user_pubkey: { type: string }
                    target_channel_id: { type: string }
                    assigned_by: { type: string }
                    created_at: { type: integer }
                    voice_only:
                      type: boolean
                      description: >-
                        Computed per row, not stored: the member lacks
                        `read_messages` on the target, so a move would land them
                        in voice-only presence. The client cannot see another
                        member's permissions, so the hub resolves it.
        "403": { description: Caller can read the channel but is neither organizer nor mover }

  /events/{event_id}/squad-rooms:
    post:
      summary: Auto-spawn temp squad voice channels
      description: >-
        Creates `count` temp voice-capable channels named "<prefix> 1"…"<prefix>
        N", parented under the event's anchor and tagged with the event id so
        clients can identify them and the reminder worker can sweep them at
        event end. Needs organizer/`create_events` **and** `move_members` on the
        anchor. See events.md §7.5.
      tags: [Events]
      parameters:
        - name: event_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [count]
              properties:
                count: { type: integer, minimum: 1, maximum: 20 }
                name_prefix: { type: string, default: Squad }
      responses:
        "201":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Channel' }

  # ── Polls ─────────────────────────────────────────────────────────────────

  /channels/{channel_id}/polls:
    get:
      summary: List polls in a channel
      description: Newest first. Paged only on hubs advertising `list.cursor.lists`.
      tags: [Polls]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          description: Page size, clamped to 1..500.
          schema: { type: integer, default: 100, minimum: 1, maximum: 500 }
        - name: cursor
          in: query
          description: Keyset cursor — the `id` of the previous page's last row.
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    channel_id: { type: string }
                    creator_pubkey: { type: string }
                    question: { type: string }
                    options: { type: string, description: "JSON-encoded array of {id, text}" }
                    ends_at: { type: integer, nullable: true }
                    max_choices: { type: integer }
                    created_at: { type: integer }
                    totals:
                      type: object
                      additionalProperties: { type: integer }
                      description: option_id → vote count
    post:
      summary: Create a poll in a channel (send_messages)
      description: Also posts a system card message into the channel. At least 2 options required.
      tags: [Polls]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [question, options]
              properties:
                question: { type: string }
                options:
                  type: array
                  items:
                    type: object
                    required: [id, text]
                    properties:
                      id: { type: string }
                      text: { type: string }
                ends_at: { type: integer, nullable: true }
                max_choices: { type: integer, default: 1 }

  /polls/{poll_id}:
    get:
      summary: Get a poll with vote totals and the caller's vote
      tags: [Polls]
      parameters:
        - name: poll_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  channel_id: { type: string }
                  creator_pubkey: { type: string }
                  question: { type: string }
                  options: { type: string, description: "JSON-encoded array of {id, text}" }
                  ends_at: { type: integer, nullable: true }
                  max_choices: { type: integer }
                  created_at: { type: integer }
                  totals:
                    type: object
                    additionalProperties: { type: integer }
                    description: option_id → vote count
                  your_vote:
                    type: array
                    items: { type: string }
                    nullable: true
    delete:
      summary: Delete a poll (creator or admin)
      tags: [Polls]
      parameters:
        - name: poll_id
          in: path
          required: true
          schema: { type: string }

  /polls/{poll_id}/vote:
    post:
      summary: Cast or replace the caller's vote
      tags: [Polls]
      parameters:
        - name: poll_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [option_ids]
              properties:
                option_ids:
                  type: array
                  items: { type: string }
                  description: Must not exceed the poll's max_choices
      responses:
        "204":
          description: Vote recorded; updated totals broadcast over WS
        "410":
          description: Poll has ended

  # ── Forum ─────────────────────────────────────────────────────────────────

  /channels/{channel_id}/posts:
    get:
      summary: List posts in a forum channel (pinned first, then by activity)
      tags: [Forum]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
        - name: cursor
          in: query
          schema: { type: string }
          description: Opaque cursor from the previous page
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 100 }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items: { $ref: '#/components/schemas/PostSummary' }
                  cursor: { type: string, description: "Omitted on the last page" }
    post:
      summary: Create a post (create_posts)
      tags: [Forum]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [title, body]
              properties:
                title: { type: string }
                body: { type: string }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostDetail' }

  /channels/{channel_id}/posts/search:
    get:
      summary: Full-text search within a forum channel
      tags: [Forum]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
        - name: q
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        post_id: { type: string }
                        title_snippet: { type: string }
                        body_snippet: { type: string }
                        is_reply: { type: boolean }
                        reply_id: { type: string }
                  cursor: { type: string }

  /channels/{channel_id}/posts/{post_id}:
    get:
      summary: Get a post with a page of replies
      tags: [Forum]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
        - name: post_id
          in: path
          required: true
          schema: { type: string }
        - name: after
          in: query
          schema: { type: string }
          description: Reply ID cursor — return replies created after it
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 100 }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostDetail' }
    patch:
      summary: Edit a post's title and/or body (author or manage_posts)
      tags: [Forum]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
        - name: post_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                body: { type: string }
    delete:
      summary: Delete a post — soft delete / tombstone (author or manage_posts)
      tags: [Forum]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
        - name: post_id
          in: path
          required: true
          schema: { type: string }

  /channels/{channel_id}/posts/{post_id}/replies:
    post:
      summary: Reply to a post (send_messages; locked posts require manage_posts)
      tags: [Forum]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
        - name: post_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
                reply_to_id: { type: string, description: "Optional parent reply within the same post" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReplyView' }

  /channels/{channel_id}/posts/{post_id}/replies/{reply_id}:
    patch:
      summary: Edit a reply (author or manage_posts)
      tags: [Forum]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
        - name: post_id
          in: path
          required: true
          schema: { type: string }
        - name: reply_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string }
    delete:
      summary: Delete a reply — soft delete (author or manage_posts)
      tags: [Forum]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
        - name: post_id
          in: path
          required: true
          schema: { type: string }
        - name: reply_id
          in: path
          required: true
          schema: { type: string }

  /channels/{channel_id}/posts/{post_id}/pin:
    post:
      summary: Pin a post (manage_posts)
      tags: [Forum]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
        - name: post_id
          in: path
          required: true
          schema: { type: string }
    delete:
      summary: Unpin a post (manage_posts)
      tags: [Forum]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
        - name: post_id
          in: path
          required: true
          schema: { type: string }

  /channels/{channel_id}/posts/{post_id}/lock:
    post:
      summary: Lock a post against new replies (manage_posts)
      tags: [Forum]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
        - name: post_id
          in: path
          required: true
          schema: { type: string }
    delete:
      summary: Unlock a post (manage_posts)
      tags: [Forum]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
        - name: post_id
          in: path
          required: true
          schema: { type: string }

  /channels/{channel_id}/posts/{post_id}/read:
    post:
      summary: Mark a post's replies as read up to now
      tags: [Forum]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
        - name: post_id
          in: path
          required: true
          schema: { type: string }

  /channels/{channel_id}/posts/{post_id}/reactions:
    post:
      summary: React to a post
      tags: [Forum]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
        - name: post_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [emoji]
              properties:
                emoji: { type: string, description: "1–8 chars" }

  /channels/{channel_id}/posts/{post_id}/reactions/{emoji}:
    delete:
      summary: Remove own reaction from a post
      tags: [Forum]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
        - name: post_id
          in: path
          required: true
          schema: { type: string }
        - name: emoji
          in: path
          required: true
          schema: { type: string }

  /channels/{channel_id}/posts/{post_id}/replies/{reply_id}/reactions:
    post:
      summary: React to a reply
      tags: [Forum]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
        - name: post_id
          in: path
          required: true
          schema: { type: string }
        - name: reply_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [emoji]
              properties:
                emoji: { type: string, description: "1–8 chars" }

  /channels/{channel_id}/posts/{post_id}/replies/{reply_id}/reactions/{emoji}:
    delete:
      summary: Remove own reaction from a reply
      tags: [Forum]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
        - name: post_id
          in: path
          required: true
          schema: { type: string }
        - name: reply_id
          in: path
          required: true
          schema: { type: string }
        - name: emoji
          in: path
          required: true
          schema: { type: string }

  /channels/{channel_id}/tags:
    get:
      summary: List a forum channel's tag definitions
      description: >-
        Tag definitions live on the channel; assigning and filtering by them
        rides the post routes. See forum.md §10.2.
      tags: [Forum]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ForumTag' }
        "409": { description: Channel is not a forum }
    post:
      summary: Create a tag definition (manage_posts)
      tags: [Forum]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string, description: 1–50 characters }
                color: { type: string, nullable: true }
                position: { type: integer, default: 0 }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ForumTag' }
        "409": { description: Channel is not a forum }

  /tags/{tag_id}:
    patch:
      summary: Edit a tag definition (manage_posts)
      description: >-
        No channel in the path — it is resolved from the tag row. `label` and
        `position` follow the usual "absent means unchanged" rule; `color` is
        tri-state, so omitting it leaves the colour alone while sending `null`
        clears it.
      tags: [Forum]
      parameters:
        - name: tag_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
                color: { type: string, nullable: true }
                position: { type: integer }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ForumTag' }
        "404": { description: tag_not_found }
    delete:
      summary: Delete a tag definition (manage_posts)
      description: Idempotent — deleting an already-deleted tag is 204.
      tags: [Forum]
      parameters:
        - name: tag_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Deleted, or already gone }

  # ── Channel-scoped moderation (pubkey field) ──────────────────────────────

  /channels/{channel_id}/bans:
    get:
      summary: List channel bans (ban_members)
      tags: [Moderation]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    channel_id: { type: string }
                    pubkey: { type: string }
                    banned_by: { type: string }
                    reason: { type: string, nullable: true }
                    banned_at: { type: integer }
    post:
      summary: Ban a user from a channel (ban_members)
      description: >
        The only channel-ban write path. A duplicate family under
        /moderation/channels/{id}/bans was folded in on 2026-08-08; this
        route used to hardcode `reason` to null on insert, silently erasing
        a reason written through the other one.
      tags: [Moderation]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [pubkey]
              properties:
                pubkey: { type: string }
                reason: { type: string, nullable: true }

  /channels/{channel_id}/bans/{pubkey}:
    delete:
      summary: Remove a channel ban (ban_members)
      tags: [Moderation]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
        - name: pubkey
          in: path
          required: true
          schema: { type: string }

  /channels/{channel_id}/voice-mutes:
    get:
      summary: List per-channel voice mutes (mute_members)
      tags: [Moderation]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    channel_id: { type: string }
                    pubkey: { type: string }
                    muted_by: { type: string }
                    muted_at: { type: string }
    post:
      summary: Voice-mute a user in a channel (mute_members)
      tags: [Moderation]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [pubkey]
              properties:
                pubkey: { type: string }

  /channels/{channel_id}/voice-mutes/{pubkey}:
    delete:
      summary: Remove a per-channel voice mute (mute_members)
      tags: [Moderation]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
        - name: pubkey
          in: path
          required: true
          schema: { type: string }

  /channels/{channel_id}/raise-hand:
    post:
      summary: Raise hand to request talk permission
      tags: [Moderation]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  channel_id: { type: string }
                  pubkey: { type: string }
                  requested_at: { type: string }

  /channels/{channel_id}/raise-hand/{pubkey}:
    delete:
      summary: Lower a hand (own hand, or anyone's with mute_members)
      tags: [Moderation]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
        - name: pubkey
          in: path
          required: true
          schema: { type: string }

  /channels/{channel_id}/raise-hands:
    get:
      summary: List raised hands in a channel (oldest first)
      tags: [Moderation]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }

  # ── Badges (hub-to-hub attestations) ──────────────────────────────────────

  /badges:
    get:
      summary: List badges this hub holds (admin)
      tags: [Badges]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    issuer_pubkey: { type: string }
                    issuer_url: { type: string }
                    label: { type: string }
                    payload: { $ref: '#/components/schemas/BadgePayload' }
                    accepted_at: { type: string }

  /badges/{id}:
    delete:
      summary: Delete a held badge (admin)
      tags: [Badges]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }

  /badges/pending:
    get:
      summary: List pending badge offers from other hubs (admin)
      tags: [Badges]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    from_hub_pubkey: { type: string }
                    from_hub_url: { type: string }
                    label: { type: string }
                    note: { type: string, nullable: true }
                    payload: { $ref: '#/components/schemas/BadgePayload' }
                    created_at: { type: string }

  /badges/pending/{id}/accept:
    post:
      summary: Accept a pending badge offer after signature re-verification (admin)
      tags: [Badges]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }

  /badges/pending/{id}/decline:
    post:
      summary: Decline and delete a pending badge offer (admin)
      tags: [Badges]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }

  /admin/badges/issue:
    post:
      summary: Issue a badge to another hub (admin)
      description: >-
        Fetches the recipient hub's /info, signs the badge payload with this
        hub's keypair, delivers it to the recipient's
        /federation/badge-offer, and records it locally.
      tags: [Badges]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [recipient_hub_url, label]
              properties:
                recipient_hub_url: { type: string }
                label: { type: string }
                note: { type: string }
                expires_days: { type: integer }
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  recipient_hub_url: { type: string }
                  recipient_hub_pubkey: { type: string }
                  label: { type: string }
                  payload: { $ref: '#/components/schemas/BadgePayload' }
                  issued_at: { type: string }
                  expires_at: { type: string, nullable: true }
        "502":
          description: Recipient hub unreachable

  /admin/badges/issued:
    get:
      summary: List badges this hub has issued (admin)
      tags: [Badges]

  /admin/badges/issued/{id}/revoke:
    delete:
      summary: Revoke an issued badge (admin)
      description: Sets `revoked_at`; the revocation appears in /federation/badge-revocations.
      tags: [Badges]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }

  /federation/badge-offer:
    post:
      summary: Receive a badge offer from another hub
      description: Hub-to-hub. The Ed25519 signature over the payload is the credential; no Bearer token.
      security: []
      tags: [Badges]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [from_hub_pubkey, from_hub_url, label, payload, signature]
              properties:
                from_hub_pubkey: { type: string }
                from_hub_url: { type: string }
                label: { type: string }
                note: { type: string, nullable: true }
                payload: { type: string, description: "Canonical BadgePayload JSON string" }
                signature: { type: string, description: "Hex Ed25519 signature over payload bytes" }

  /federation/badge-revocations:
    get:
      summary: List badges this hub has revoked (public, polled by other hubs)
      security: []
      tags: [Badges]
      parameters:
        - name: since
          in: query
          schema: { type: string }
          description: ISO-8601 timestamp — only revocations at or after this time
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    recipient_hub_pubkey: { type: string }
                    label: { type: string }
                    revoked_at: { type: string }

  # ── Certifications ────────────────────────────────────────────────────────

  /admin/certs:
    get:
      summary: List all cert issuances (admin)
      tags: [Certifications]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    subject_pubkey: { type: string }
                    pow_level: { type: integer, nullable: true }
                    member_since: { type: integer }
                    issued_at: { type: integer }
                    expires_at: { type: integer }
                    revoked_at: { type: integer, nullable: true }
                    standing: { type: string, enum: [good, revoked] }
                    payload: { $ref: '#/components/schemas/CertPayload' }

  /admin/certs/{pubkey}:
    post:
      summary: Manually issue a cert for a user (admin)
      tags: [Certifications]
      parameters:
        - name: pubkey
          in: path
          required: true
          schema: { type: string }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Certification' }
        "403":
          description: User not approved or banned

  /admin/certs/{pubkey}/badge:
    post:
      summary: Grant a named achievement badge to a user (admin)
      description: >-
        A badge is a certification carrying a label (+ optional
        description/icon); it lands in the user's portfolio and links back
        to this hub via issuer_url.
      tags: [Certifications]
      parameters:
        - name: pubkey
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string, description: "1–64 chars" }
                description: { type: string }
                icon: { type: string }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Certification' }
        "403":
          description: User not approved or banned

  /admin/certs/{pubkey}/revoke:
    post:
      summary: Revoke a user's certs (admin)
      description: Marks existing certs revoked and re-issues a short-lived standing=revoked cert so pull-path verifiers see it.
      tags: [Certifications]
      parameters:
        - name: pubkey
          in: path
          required: true
          schema: { type: string }

  /admin/settings/certs:
    get:
      summary: Get certification settings (admin)
      tags: [Certifications]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  cert_mode: { type: string, enum: [none, any, trusted] }
                  cert_auto_issue: { type: boolean }
                  cert_min_age_days: { type: integer }
                  cert_validity_days: { type: integer }
                  cert_trusted_issuers: { type: array, items: { type: string } }
                  cert_issuer_urls:
                    type: object
                    additionalProperties: { type: string }
                    description: >-
                      Issuer pubkey to base URL, for the issuers this hub can
                      pull a portfolio from during admission. Sparse: trust does
                      not require an address, and an issuer without one still
                      has its pushed certs honoured.
    patch:
      summary: Update certification settings (admin)
      description: >-
        All fields optional. Scalars are accepted as strings, booleans or
        numbers and stored as text; `cert_min_age_days` is an accepted alias
        for `cert_standing_days`, which is what GET calls the same setting.
      tags: [Certifications]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cert_auto_issue:
                  oneOf: [{ type: string }, { type: boolean }]
                cert_standing_days:
                  oneOf: [{ type: string }, { type: integer }]
                cert_min_age_days:
                  oneOf: [{ type: string }, { type: integer }]
                cert_validity_days:
                  oneOf: [{ type: string }, { type: integer }]
                cert_mode: { type: string, enum: [none, any, trusted] }
                cert_trusted_issuers: { type: array, items: { type: string } }
                cert_require:
                  type: object
                  properties:
                    min_pow_level: { type: integer }
                    min_member_since_days: { type: integer }
                cert_min_pow_level:
                  oneOf: [{ type: string }, { type: integer }]
                cert_issuer_urls:
                  type: object
                  additionalProperties: { type: string }
                  description: Replaces the whole map, like the trust list it accompanies.

  /identity/{pubkey}/certs:
    get:
      summary: List valid certs for a user (public)
      description: >-
        Returns non-revoked, non-expired certs this hub issued for the user
        plus cross-hub certs deposited into the user's portfolio. Used by
        receiving hubs to pull certs directly from the issuer.
      security: []
      tags: [Certifications]
      parameters:
        - name: pubkey
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Certification' }

  /certs/revocations:
    get:
      summary: List cert revocations (public, polled by other hubs)
      security: []
      tags: [Certifications]
      parameters:
        - name: since
          in: query
          schema: { type: integer }
          description: Unix timestamp — only revocations at or after this time
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    subject_pubkey: { type: string }
                    revoked_at: { type: integer }

  # ── Recovery contacts / key rotation ──────────────────────────────────────

  /recovery/contacts:
    get:
      summary: Get the caller's recovery contacts and threshold
      tags: [Recovery]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  owner_pubkey: { type: string }
                  contacts:
                    type: array
                    items:
                      type: object
                      properties:
                        pubkey: { type: string }
                        added_at: { type: integer }
                  threshold: { type: integer }
    put:
      summary: Replace the caller's recovery contact list
      description: Max 5 contacts; threshold must be between 1 and the contact count; the caller cannot be their own contact.
      tags: [Recovery]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [contacts, threshold]
              properties:
                contacts: { type: array, items: { type: string } }
                threshold: { type: integer }

  /recovery/contacts/{pubkey}:
    delete:
      summary: Remove one recovery contact
      tags: [Recovery]
      parameters:
        - name: pubkey
          in: path
          required: true
          schema: { type: string }

  /recovery/rotate-key:
    post:
      summary: Open a key-rotation request with inline attestations
      description: >-
        Called by the NEW key — no Bearer token required. Attestations from
        configured recovery contacts are validated; once the count reaches the
        owner's threshold the request flips to `ready_for_review` for admin
        action.
      security: []
      tags: [Recovery]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [old_pubkey, new_pubkey, attestations]
              properties:
                old_pubkey: { type: string }
                new_pubkey: { type: string }
                reason: { type: string }
                attestations:
                  type: array
                  items:
                    type: object
                    required: [attester, signature]
                    properties:
                      attester: { type: string }
                      signature: { type: string }
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  old_pubkey: { type: string }
                  new_pubkey: { type: string }
                  status: { type: string, enum: [pending, ready_for_review] }
                  created_at: { type: integer }
                  attestation_count: { type: integer }

  /recovery/requests:
    get:
      summary: List the caller's own rotation requests
      tags: [Recovery]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    new_pubkey: { type: string }
                    status: { type: string }
                    created_at: { type: integer }
                    attestation_count: { type: integer }
                    threshold: { type: integer }

  /admin/recovery/pending:
    get:
      summary: List rotation requests awaiting admin review (admin)
      tags: [Recovery]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    old_pubkey: { type: string }
                    new_pubkey: { type: string }
                    reason: { type: string, nullable: true }
                    status: { type: string }
                    created_at: { type: integer }
                    attestation_count: { type: integer }

  /admin/recovery/{id}/approve:
    post:
      summary: Approve a rotation request (admin)
      description: Transfers roles to the new key and revokes all sessions for the old key; the user re-authenticates with the new key.
      tags: [Recovery]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }

  /admin/recovery/{id}/deny:
    post:
      summary: Deny a rotation request (admin)
      tags: [Recovery]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }

  /recovery/rotation-request/{id}:
    get:
      summary: The bundle a recovery contact signs, plus progress
      description: >-
        No session required: a contact learns the request id out of band and may
        not hold an account on this hub at all. See recovery-attestation.md §2.
      security: []
      tags: [Recovery]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  hub_pubkey: { type: string }
                  old_pubkey: { type: string }
                  new_pubkey: { type: string }
                  nonce: { type: string }
                  status: { type: string, enum: [pending, ready_for_review, approved, rejected] }
                  attestation_count: { type: integer }
                  threshold: { type: integer }

  /recovery/rotation-request/{id}/attest:
    post:
      summary: A recovery contact vouches for an open rotation request
      description: >-
        The signature is over the canonical `wavvon/recovery-attestation/v1`
        bundle bytes. Signed with the **roster** identity key the hub knows the
        contact by, never a derived multi-device master key. Deduped per
        contact; reaching the owner's threshold flips the request from
        `pending` to `ready_for_review` for admin action.
      security: []
      tags: [Recovery]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [attester, signature]
              properties:
                attester: { type: string, description: Contact's public key, hex }
                signature: { type: string, description: Ed25519 signature over the bundle, hex }
      responses:
        "204": { description: Attestation recorded }
        "400": { description: Bad signature, or the attester is the old or new key }
        "403": { description: Attester is not a designated contact for this owner }
        "409": { description: Request is no longer accepting attestations }

  # ── Incoming webhooks ─────────────────────────────────────────────────────

  /admin/webhooks:
    post:
      summary: Create an incoming webhook for a channel (admin)
      description: The returned `webhook_url` embeds the secret token and is shown **once** — only its hash is stored.
      tags: [Webhooks]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [channel_id, display_name]
              properties:
                channel_id: { type: string }
                display_name: { type: string }
                avatar_url: { type: string }
                rate_limit: { type: integer, default: 5 }
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  webhook_url: { type: string, description: "Full URL including the secret token" }
                  display_name: { type: string }

  /admin/webhooks/{id}:
    delete:
      summary: Deactivate a webhook (admin)
      tags: [Webhooks]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }

  /webhooks/{id}/{token}:
    post:
      summary: Post a message via an incoming webhook
      description: No Authorization header — the token in the URL is the credential (compared in constant time against the stored hash).
      security: []
      tags: [Webhooks]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: token
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
                username: { type: string, description: "Overrides the webhook's display name" }
                avatar_url: { type: string }
                embeds: { type: object }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, description: "Created message ID" }
        "401":
          description: Invalid webhook token

  # ── Outgoing webhooks (hub -> external URL push) ──────────────────────────

  /admin/outgoing-webhooks:
    get:
      summary: List outgoing webhooks (admin)
      tags: [OutgoingWebhooks]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    url: { type: string }
                    display_name: { type: string, nullable: true }
                    active: { type: boolean }
                    failure_count: { type: integer }
                    last_delivery_at: { type: integer, nullable: true }
                    last_failure_at: { type: integer, nullable: true }
                    created_at: { type: integer }
                    created_by_pubkey: { type: string }
                    subscription_count: { type: integer }
    post:
      summary: Create an outgoing webhook (admin)
      description: >-
        `url` must be https and must not resolve to a private/loopback
        address. The returned `secret` is shown once and used to derive the
        persisted HMAC signing key.
      tags: [OutgoingWebhooks]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string }
                display_name: { type: string }
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  url: { type: string }
                  display_name: { type: string, nullable: true }
                  secret: { type: string, description: "Shown once. Never persisted or returned again." }

  /admin/outgoing-webhooks/{id}:
    patch:
      summary: Update an outgoing webhook's URL, name, or active state (admin)
      tags: [OutgoingWebhooks]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string }
                display_name: { type: string }
                active: { type: boolean }
    delete:
      summary: Delete an outgoing webhook (admin)
      tags: [OutgoingWebhooks]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }

  /admin/outgoing-webhooks/{id}/subscriptions:
    get:
      summary: List an outgoing webhook's event subscriptions (admin)
      tags: [OutgoingWebhooks]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscriptions:
                    type: array
                    items:
                      type: object
                      properties:
                        event: { type: string }
                        channels:
                          type: array
                          items: { type: string }
                          nullable: true
    put:
      summary: Replace an outgoing webhook's event subscriptions (admin)
      description: "`message.*` events (other than `message.mention_bot`) require an explicit `channels` list."
      tags: [OutgoingWebhooks]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [subscriptions]
              properties:
                subscriptions:
                  type: array
                  items:
                    type: object
                    required: [event]
                    properties:
                      event: { type: string }
                      channels:
                        type: array
                        items: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }

  /admin/outgoing-webhooks/{id}/rotate-secret:
    post:
      summary: Rotate an outgoing webhook's signing secret (admin)
      tags: [OutgoingWebhooks]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string, description: "Shown once. Never persisted or returned again." }

  /admin/outgoing-webhooks/{id}/enable:
    post:
      summary: Re-enable a disabled outgoing webhook and reset its failure count (admin)
      tags: [OutgoingWebhooks]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }

  /admin/outgoing-webhooks/{id}/deliveries:
    get:
      summary: List recent delivery attempts for an outgoing webhook (admin)
      tags: [OutgoingWebhooks]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: event_type
          in: query
          schema: { type: string }
        - name: success
          in: query
          schema: { type: boolean }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    webhook_id: { type: string }
                    event_type: { type: string }
                    event_seq: { type: integer, nullable: true }
                    attempted_at: { type: integer }
                    attempt_number: { type: integer }
                    status_code: { type: integer, nullable: true }
                    success: { type: boolean }
                    error_msg: { type: string, nullable: true }

  # ── Bots (external bot system) ────────────────────────────────────────────

  /bots:
    get:
      summary: List external bots on this hub (any member)
      tags: [Bots]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    pubkey: { type: string }
                    name: { type: string }
                    avatar_url: { type: string }
                    description: { type: string }
                    last_seen_at: { type: integer }
                    webhook_url: { type: string }
                    commands:
                      type: array
                      items:
                        type: object
                        properties:
                          name: { type: string }
                          description: { type: string }
    post:
      summary: Invite an external bot by pubkey (manage_roles or admin)
      tags: [Bots]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [pubkey]
              properties:
                pubkey: { type: string, description: "64-hex-char Ed25519 public key" }
                note: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  invite_token: { type: string }

  /bots/{pubkey}:
    delete:
      summary: Remove an external bot (admin)
      tags: [Bots]
      parameters:
        - name: pubkey
          in: path
          required: true
          schema: { type: string }

  /bots/accept-invite:
    post:
      summary: Bot accepts an invite by signing the invite token
      security: []
      tags: [Bots]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [pubkey, signature_over_token, bot_meta]
              properties:
                pubkey: { type: string }
                signature_over_token: { type: string, description: "Hex Ed25519 signature over the invite token" }
                bot_meta:
                  type: object
                  required: [name]
                  properties:
                    name: { type: string }
                    avatar_url: { type: string }
                    webhook_url: { type: string }
                    description: { type: string }
                    homepage_url: { type: string }
                    commands: { type: array, items: { type: object } }
                    capabilities: { type: array, items: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: accepted }
        "410":
          description: Invite token has expired

  /bots/me:
    get:
      summary: Bot fetches its own profile and commands (bot identity only)
      tags: [Bots]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  pubkey: { type: string }
                  name: { type: string }
                  avatar_url: { type: string }
                  description: { type: string }
                  webhook_url: { type: string }
                  homepage_url: { type: string }
                  capabilities: { type: array, items: { type: string } }
                  commands: { type: array, items: { type: object } }
        "403":
          description: Caller is not a bot identity

  /bots/me/profile:
    put:
      summary: Bot replaces its own profile (bot identity only)
      tags: [Bots]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                avatar_url: { type: string }
                webhook_url: { type: string }
                description: { type: string }
                homepage_url: { type: string }
                capabilities: { type: array, items: { type: string } }

  /bots/me/commands:
    put:
      summary: Bot replaces its slash-command list (bot identity only)
      tags: [Bots]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [commands]
              properties:
                commands:
                  type: array
                  items:
                    type: object
                    required: [name, description]
                    properties:
                      name: { type: string }
                      description: { type: string }
                      args: { type: string }
                      scope: { type: string }
                      privileged: { type: boolean }
                      cooldown_seconds: { type: integer }

  /bots/me/subscriptions:
    put:
      summary: Bot replaces its event subscriptions (bot identity only)
      tags: [Bots]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [subscriptions]
              properties:
                subscriptions:
                  type: array
                  items:
                    type: object
                    properties:
                      event: { type: string }
                      channel_id: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }

  /bots/{id}/voice/leave:
    delete:
      summary: Bot leaves a voice channel
      description: >
        Runs the same cleanup as a normal WebSocket voice disconnect.
        Idempotent — calling when not in the channel is a no-op.
      tags: [Bots]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel_id]
              properties:
                channel_id: { type: string }
      responses:
        "204": { description: No content }
        "403": { description: "Caller is not the bot identified by {id}" }

  /bots/{id}/screenshare/start:
    post:
      summary: Bot registers a video stream in a channel
      description: >
        Registers a new screen-share stream for the bot and broadcasts
        `screen_share_started` to all channel subscribers. After this call
        the bot pushes `screen_share_chunk` binary envelopes over its WS
        connection using the returned `stream_id`.
      tags: [Bots]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel_id]
              properties:
                channel_id: { type: string }
                kind: { type: string, default: screen, description: "e.g. screen, webcam, video" }
                mime: { type: string, default: video/webm }
                has_audio: { type: boolean, default: false }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  stream_id: { type: string }
                  channel_id: { type: string }
        "403": { description: "Caller is not the bot identified by {id}" }
        "404": { description: Channel not found }

  /bots/{id}/screenshare/stop:
    delete:
      summary: Bot stops a previously started video stream
      description: >
        Deregisters the stream and broadcasts `screen_share_stopped` to all
        channel subscribers. Notifies any cross-channel subscribers that their
        subscription ended. Idempotent — safe to call if the stream is already
        gone.
      tags: [Bots]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel_id, stream_id]
              properties:
                channel_id: { type: string }
                stream_id: { type: string }
      responses:
        "204": { description: No content — idempotent if stream already gone }
        "403": { description: "Caller is not the bot identified by {id}" }

  # ── Group DM membership / sender keys ─────────────────────────────────────

  /conversations/{conversation_id}/members:
    post:
      summary: Add a member to a group conversation (members only; not 1-on-1 DMs)
      tags: [DMs]
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [public_key]
              properties:
                public_key: { type: string }

  /conversations/{conversation_id}/members/{pubkey}:
    delete:
      summary: Leave a group conversation (callers may only remove themselves)
      tags: [DMs]
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema: { type: string }
        - name: pubkey
          in: path
          required: true
          schema: { type: string }

  /conversations/{conversation_id}/sender-keys:
    get:
      summary: Fetch wrapped group sender keys addressed to the caller
      tags: [DMs]
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    sender_pubkey: { type: string }
                    sender_key_version: { type: integer }
                    iteration: { type: integer }
                    wrapped_key_hex: { type: string }
                    wrap_nonce_hex: { type: string }
                    created_at: { type: integer }
    put:
      summary: Distribute the caller's group sender key (group conversations only)
      tags: [DMs]
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [sender_key_version, recipients, signature_hex]
              properties:
                sender_key_version: { type: integer }
                recipients:
                  type: array
                  items:
                    type: object
                    required: [recipient_pubkey, wrapped_key_hex, wrap_nonce_hex, iteration]
                    properties:
                      recipient_pubkey: { type: string }
                      wrapped_key_hex: { type: string }
                      wrap_nonce_hex: { type: string }
                      iteration: { type: integer }
                signature_hex: { type: string, description: "Ed25519 signature over canonical bytes" }

  # ── DM block set ──────────────────────────────────────────────────────────

  /identity/dm-blocks:
    get:
      summary: Get the caller's DM-block set
      tags: [Identity]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  pubkeys: { type: array, items: { type: string } }
    put:
      summary: Replace the caller's DM-block set
      tags: [Identity]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [pubkeys]
              properties:
                pubkeys: { type: array, items: { type: string } }

  # ── Alliances (hub-to-hub join + push invite) ─────────────────────────────

  /alliances/{alliance_id}/join:
    post:
      summary: Remote hub joins an alliance with an invite token
      description: Hub-to-hub. The invite token (this hub's signature over the alliance id) is the credential; no Bearer token.
      security: []
      tags: [Alliances]
      parameters:
        - name: alliance_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [invite_token, hub_url]
              properties:
                invite_token: { type: string }
                hub_url: { type: string }

  /alliances/{alliance_id}/push-invite:
    post:
      summary: Push a direct alliance invite to another hub (admin)
      tags: [Alliances]
      parameters:
        - name: alliance_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [target_hub_url, own_hub_url]
              properties:
                target_hub_url: { type: string }
                own_hub_url: { type: string }
                message: { type: string, nullable: true }

  # ── Join links ────────────────────────────────────────────────────────────

  /join/{code}:
    get:
      summary: Preview an invite (public)
      security: []
      tags: [Invites]
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  hub_name: { type: string }
                  member_count: { type: integer }
                  code: { type: string }
        "404":
          description: Invite not found
        "410":
          description: Invite expired or fully used
    post:
      summary: Redeem an invite (requires session token)
      description: Increments the invite's use count and auto-approves the caller, bypassing the approval queue.
      tags: [Invites]
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Joined
        "410":
          description: Invite expired or fully used

  # ── User profiles ─────────────────────────────────────────────────────────

  /users/{pubkey}/profile:
    get:
      summary: Get a user's hub profile (roles + badges)
      tags: [Users]
      parameters:
        - name: pubkey
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  public_key: { type: string }
                  display_name: { type: string, nullable: true }
                  avatar: { type: string, nullable: true }
                  joined_at: { type: integer }
                  roles:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        color: { type: string, nullable: true }
                  badges:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        label: { type: string }

  # ── Federation (discovery + ban list) ─────────────────────────────────────

  /federation/listing:
    get:
      summary: Hub discovery metadata (public)
      description: Always returns 200 with all fields, even when `listed` is false, so clients can probe any hub URL.
      security: []
      tags: [Federation]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  description: { type: string, nullable: true }
                  public_key: { type: string }
                  hub_url: { type: string }
                  tags: { type: array, items: { type: string } }
                  member_count_approx: { type: integer, description: "Rounded down to the nearest 10" }
                  listed: { type: boolean }

  /federation/banlist:
    get:
      summary: Signed export of this hub's ban list (public)
      description: Subscribing hubs poll this feed; the Ed25519 signature is the authority.
      security: []
      tags: [Federation]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  payload:
                    type: object
                    properties:
                      issuer_pubkey: { type: string }
                      issued_at: { type: integer }
                      entries:
                        type: array
                        items:
                          type: object
                          properties:
                            master_pubkey: { type: string }
                            reason: { type: string, nullable: true }
                            added_at: { type: integer }
                  signature: { type: string }

tags:
  - name: Health
  - name: Auth
    description: Challenge-response authentication. No Bearer token required.
  - name: Me
  - name: Hub
  - name: Channels
  - name: Messages
  - name: DMs
  - name: Friends
  - name: Invites
  - name: Roles
  - name: Moderation
  - name: Users
  - name: Alliances
  - name: Lobby
    description: Security-level lobby. Only accessible with scope=lobby.
  - name: Challenge
    description: Bot-challenge verification (pre-auth).
  - name: Survey
    description: Onboarding role questionnaire.
  - name: Bots
    description: Self-service bot creation and bot API.
  - name: Identity
    description: Multi-device identity and E2E key exchange.
  - name: Profile
  - name: Federation
    description: Hub-to-hub federation endpoints.
  - name: WebSocket
  - name: Voice
  - name: Badges
    description: Hub-to-hub badge attestations (issue, accept, revoke).
  - name: Certifications
    description: Signed user certifications and admission policy.
  - name: Events
    description: Hub calendar events with RSVPs.
  - name: Polls
  - name: Forum
    description: Threaded posts in forum-type channels.
  - name: Games
    description: Game install/enable (Tier 1) and live sessions (Tier 2 + legacy).
  - name: Recovery
    description: Social-recovery contacts and key rotation.
  - name: Webhooks
    description: Incoming webhooks for posting messages from external services.
  - name: OutgoingWebhooks
    description: Outgoing webhooks — hub pushes signed event payloads to an external URL.
  - name: Soundboard
    description: Per-hub voice soundboard clip library.
  - name: Search
  - name: Emojis
  - name: Uploads
