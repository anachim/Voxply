  /conversations/{conversation_id}/messages:
    get:
      summary: List messages in a DM conversation (paginated)
      description: >
        Newest `limit` messages, returned oldest-first. Page backwards with
        `before` = the `id` of the oldest row you already have. Before
        2026-08-08 this took no query params and returned the entire history
        on every call, though both clients were already sending these two.
      tags: [DMs]
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          description: Page size, clamped to 1..100.
          schema: { type: integer, default: 50, minimum: 1, maximum: 100 }
        - name: before
          in: query
          description: Keyset cursor — the `id` of the oldest message already held.
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DmMessage' }
    post:
      summary: Send a DM
      tags: [DMs]
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
