                challenge_mode: { type: string, enum: [off, click, puzzle, both] }

  # ── Channels ──────────────────────────────────────────────────────────────

  /channels:
    get:
      summary: List all channels and categories
      tags: [Channels]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Channel' }
    post:
      summary: Create a channel or category (manage_channels)
      tags: [Channels]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                is_category: { type: boolean }
                parent_id: { type: string, nullable: true }
                description: { type: string }

  /channels/reorder:
    post:
      summary: Reorder channels (manage_channels)
      tags: [Channels]

  /channels/{channel_id}:
    patch:
      summary: Update channel (manage_channels)
      tags: [Channels]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
    delete:
      summary: Delete channel (manage_channels)
      tags: [Channels]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }

  # ── Channel permission overwrites (nested-channels §3.6) ──────────────────

  /channels/{channel_id}/my-permissions:
    get:
      summary: Caller's resolved effective permissions on a channel
      description: >-
        Not gated on manage_roles — any member may see their own effective
        channel-scoped permission set (hub-wide baseline + ancestor-chain
        overwrite cascade). `is_admin` short-circuits every check.
      tags: [Channels]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  channel_id: { type: string }
                  permissions: { type: array, items: { type: string } }
                  is_admin: { type: boolean }

  /channels/{channel_id}/permissions:
    get:
      summary: Get resolved permission overwrites for every role on a channel (manage_roles)
      tags: [Channels]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  channel_id: { type: string }
                  roles:
                    type: array
                    items:
                      type: object
                      properties:
                        role_id: { type: string }
                        role_name: { type: string }
                        overwrites:
                          type: object
                          properties:
                            allow: { type: array, items: { type: string } }
                            deny: { type: array, items: { type: string } }
                        inherited: { type: array, items: { type: string } }
                        effective: { type: array, items: { type: string } }

  /channels/{channel_id}/permissions/{role_id}:
    put:
      summary: Replace a role's permission overwrites on a channel (manage_roles)
      description: >-
        Cannot grant `admin` via an overwrite, cannot edit a role at or
        above the caller's own priority, and can only allow permissions
        the caller effectively holds on the channel.
      tags: [Channels]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
        - name: role_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                allow: { type: array, items: { type: string } }
                deny: { type: array, items: { type: string } }
      responses:
        "403":
          description: Role at or above caller's priority, or grant exceeds caller's own permissions
    delete:
      summary: Clear a role's permission overwrites on a channel (manage_roles)
      tags: [Channels]
      parameters:
        - name: channel_id
          in: path
          required: true
          schema: { type: string }
        - name: role_id
          in: path
          required: true
          schema: { type: string }

  # /channels/{channel_id}/members was removed 2026-08-08: it ignored its
  # channel_id and returned the same rows as GET /users. Use /users.

  /voice/populations:
    get:
      summary: Voice user count per channel
      tags: [Voice]

  /voice/active-users:
    get:
      summary: List all users in any voice channel
      tags: [Voice]

  /voice/participants:
    get:
      summary: Participants in the caller's current voice channel
      tags: [Voice]

  # ── Messages ──────────────────────────────────────────────────────────────

  /channels/{channel_id}/messages:
